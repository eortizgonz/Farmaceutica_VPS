services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharma_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-pharma_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-farmaceutica-copilot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pharma_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-pharma_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in .env}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-220}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      FLASK_DEBUG: 0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8010}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  collector:
    image: ${APP_IMAGE:-farmaceutica-copilot:local}
    restart: unless-stopped
    entrypoint: []
    healthcheck:
      disable: true
    command:
      - python
      - -m
      - flask
      - --app
      - app
      - run-reading-collector
      - --interval-seconds
      - "${PREDICTIVE_CAPTURE_INTERVAL:-900}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pharma_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-pharma_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in .env}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
